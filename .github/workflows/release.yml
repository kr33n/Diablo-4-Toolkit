name: Build and publish Windows executable

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pyinstaller keyboard psutil pywin32

      - name: Build executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --noupx
          --name Diablo4Toolkit
          --icon assets/images/logo.ico
          --add-data "assets:assets"
          --add-data "core/DiabloCameraPresets.json:core"
          --hidden-import win32api
          --hidden-import win32gui
          --hidden-import win32con
          main.py

      - name: Attach executable to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/Diablo4Toolkit.exe" --clobber
